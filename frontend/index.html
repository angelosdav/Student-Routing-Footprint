<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSRM Transit Router Attica UNIWA</title>
    <!-- Google Fonts & Leaflet CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            /* Deep OLED Slate Palette, Rich Depth & High Contrast */
            --bg-color: #030712;
            --panel-bg: rgba(15, 23, 42, 0.95);
            --card-bg: rgba(30, 41, 59, 0.65);
            --card-hover-bg: rgba(30, 41, 59, 0.95);
            --border-color: rgba(255, 255, 255, 0.1);
            --border-active: #38bdf8;

            /* Text */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;

            /* Geometry */
            --shadow-card: 0 8px 24px -6px rgba(0, 0, 0, 0.5);
            --radius-lg: 10px;
            --radius-md: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* Sleek custom scrollbars */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #030712;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        #sidebar {
            width: 480px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 1000;
            box-shadow: 8px 0 32px rgba(0, 0, 0, 0.8);
            overflow-y: auto;
        }

        .header {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.30rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }

        .header p {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            align-items: end;
        }

        .input-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
            justify-content: flex-end;
        }

        .input-field label {
            font-size: 0.70rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            line-height: 1.25;
            min-height: 14px;
        }

        .input-field input, .input-field select {
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 8px 10px;
            height: 38px;
            color: #ffffff;
            font-size: 0.83rem;
            outline: none;
            transition: border-color 0.15s ease;
            width: 100%;
            text-overflow: ellipsis;
            box-sizing: border-box;
        }

        .input-field input:focus, .input-field select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .btn-calc {
            background: #38bdf8;
            color: #030712;
            border: none;
            border-radius: var(--radius-md);
            padding: 12px;
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .btn-calc:hover {
            background: #7dd3fc;
        }

        .btn-calc:active {
            background: #0284c7;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: var(--shadow-card);
        }

        .card:hover {
            background: var(--card-hover-bg);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .card.active {
            border-color: var(--border-active);
            background: var(--card-hover-bg);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 0.94rem;
            color: #ffffff;
        }

        .mode-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-badge {
            font-size: 0.70rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 700;
            letter-spacing: 0.3px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .card-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            background: #090d16;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .metric {
            display: flex;
            flex-direction: column;
        }

        .metric-val {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
        }

        .metric-lbl {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .co2-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            font-size: 0.80rem;
        }

        .co2-lbl {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .co2-val {
            font-weight: 700;
            font-size: 0.90rem;
            color: #38bdf8;
        }

        .steps-flow {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 2px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            font-size: 0.78rem;
        }

        .step-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            padding: 8px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .step-tag {
            font-size: 0.64rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            margin-right: 6px;
        }

        .step-title-text {
            font-weight: 600;
            color: var(--text-main);
        }

        .step-subtext {
            font-size: 0.70rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .step-meta {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
        }

        #map {
            flex: 1;
            height: 100%;
            width: 100%;
        }

        .loading {
            display: none;
            text-align: center;
            color: #38bdf8;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 8px;
        }

        .map-legend {
            position: absolute;
            bottom: 30px;
            right: 20px;
            background: rgba(9, 13, 22, 0.90);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            z-index: 1000;
            backdrop-filter: blur(8px);
            color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .legend-title {
            font-size: 0.70rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.82rem;
            font-weight: 500;
        }

        .legend-line {
            width: 24px;
            height: 4px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <h1>OSRM Transit Router</h1>
            <p>Multinomial Logit Choice Model & Fleet Emission Analytics (Athens Universities)</p>
        </div>

        <div class="input-group">
            <div class="input-grid">
                <div class="input-field">
                    <label>Origin Postal Code</label>
                    <input type="text" id="tkStart" value="12461" placeholder="e.g. 12461">
                </div>
                <div class="input-field">
                    <label>Destination Campus</label>
                    <select id="tkEnd" onchange="calculateRoute()">
                        <optgroup label="ΕΚΠΑ">
                            <option value="15784">Ζωγράφου - 157 84</option>
                            <option value="11527">Γουδή (Ιατρική) - 115 27</option>
                            <option value="10679">Κέντρο (Προπύλαια) - 106 79</option>
                            <option value="17237">Δάφνη (ΣΕΦΑΑ) - 172 37</option>
                        </optgroup>
                        <optgroup label="ΕΜΠ (Πολυτεχνείο)">
                            <option value="15780">Ζωγράφου - 157 80</option>
                            <option value="10682">Πατησίων - 106 82</option>
                        </optgroup>
                        <optgroup label="ΟΠΑ (ΑΣΟΕΕ)">
                            <option value="10434">Πατησίων (Κεντρικό) - 104 34</option>
                            <option value="11362">Ευελπίδων - 113 62</option>
                            <option value="11257">Τροίας - 112 57</option>
                        </optgroup>
                        <optgroup label="ΠΑΔΑ">
                            <option value="12243" selected>Άλσος Αιγάλεω - 122 43</option>
                            <option value="12244">Αρχαίος Ελαιώνας - 122 44</option>
                            <option value="11521">Αμπελόκηποι (ΕΣΔΥ) - 115 21</option>
                        </optgroup>
                        <optgroup label="ΠΑΠΕΙ">
                            <option value="18534">Πειραιάς (Κεντρικό) - 185 34</option>
                            <option value="18532">Γρ. Λαμπράκη - 185 32</option>
                        </optgroup>
                        <optgroup label="Άλλες Σχολές">
                            <option value="17121">Πάντειον - 171 21</option>
                            <option value="11855">Γεωπονικό (Βοτανικός) - 118 55</option>
                            <option value="17676">Χαροκόπειο - 176 76</option>
                            <option value="18233">ΑΣΚΤ (Ταύρος) - 182 33</option>
                            <option value="10105">Σχολή Ικάρων - 101 05</option>
                            <option value="18539">Ναυτικών Δοκίμων - 185 39</option>
                            <option value="16673">Σχολή Ευελπίδων - 166 73</option>
                        </optgroup>
                    </select>
                </div>
            </div>
            <div class="input-field">
                <label>Departure Time</label>
                <select id="timeScenario" onchange="handleTimeChange()">
                    <option value="live" id="liveTimeOption">Now (Live)</option>
                    <option value="08:00">08:00 (Morning Peak)</option>
                    <option value="10:00">10:00 (Off-Peak)</option>
                    <option value="14:00">14:00 (Off-Peak)</option>
                    <option value="17:00">17:00 (Evening Peak)</option>
                    <option value="21:00">21:00 (Night Off-Peak)</option>
                </select>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px; margin: 4px 0;">
                <label style="font-size: 0.70rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted);">Vehicle Availability & Passenger Context</label>
                <div class="input-grid">
                    <div class="input-field">
                        <label>Private Car</label>
                        <select id="hasCar" onchange="calculateRoute()">
                            <option value="unknown" selected>Default (20% Base)</option>
                            <option value="yes">Available (Yes)</option>
                            <option value="no">None (No)</option>
                        </select>
                    </div>
                    <div class="input-field">
                        <label>Motorcycle</label>
                        <select id="hasMoto" onchange="calculateRoute()">
                            <option value="unknown" selected>Default (15% Base)</option>
                            <option value="yes">Available (Yes)</option>
                            <option value="no">None (No)</option>
                        </select>
                    </div>
                </div>
                <div class="input-field" style="margin-top: 4px;">
                    <label>Passenger Context (CO₂ Multiplier)</label>
                    <select id="passengerRole" onchange="calculateRoute()">
                        <option value="1.0" selected>Solo Driver (1.0x)</option>
                        <option value="0.5">Carpool / Shared Ride (0.5x)</option>
                        <option value="2.0">Drop-off / Parent Escort (2.0x Round Trip)</option>
                    </select>
                </div>
            </div>
            <button class="btn-calc" onclick="calculateRoute()">Calculate Optimal Routes</button>
            <div class="loading" id="loadingState">Querying OSRM cluster engines...</div>
        </div>

        <div class="results-container" id="results">
            <!-- Dynamic Cards inserted here -->
        </div>
    </div>

    <div class="map-legend">
        <div class="legend-title">Route Legend</div>
        <div class="legend-item"><div class="legend-line" style="background: #0284c7;"></div><span>Car</span></div>
        <div class="legend-item"><div class="legend-line" style="background: #d946ef;"></div><span>Motorcycle</span></div>
        <div class="legend-item"><div class="legend-line" style="background: #ef4444;"></div><span>Metro</span></div>
        <div class="legend-item"><div class="legend-line" style="background: #f59e0b;"></div><span>Bus</span></div>
        <div class="legend-item"><div class="legend-line" style="border-top: 4px dashed #059669; height:0; background:transparent;"></div><span>Walk</span></div>
    </div>
    <div id="map"></div>

        async function geocode(tk, isDestination = false) {
            const cleanTk = tk.trim();
            if (isDestination && UNIVERSITY_DESTINATIONS[cleanTk]) {
                return { 
                    lat: UNIVERSITY_DESTINATIONS[cleanTk].lat, 
                    lon: UNIVERSITY_DESTINATIONS[cleanTk].lon, 
                    tk: cleanTk,
                    name: UNIVERSITY_DESTINATIONS[cleanTk].name,
                    campus: UNIVERSITY_DESTINATIONS[cleanTk].campus
                };
            }
            if (LOCAL_POSTCODES[cleanTk]) {
                return { lat: LOCAL_POSTCODES[cleanTk].lat, lon: LOCAL_POSTCODES[cleanTk].lon, tk: cleanTk };
            }
            if (KNOWN_COORDS[cleanTk]) {
                return { lat: KNOWN_COORDS[cleanTk].lat, lon: KNOWN_COORDS[cleanTk].lon, tk: cleanTk };
            }

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=gr&postalcode=${cleanTk}`);
                const data = await res.json();
                if (data && data.length > 0) {
                    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), tk: cleanTk };
                }
            } catch (e) {
                console.warn("Nominatim Geocoding Fallback Failed:", e);
            }
            return { lat: 37.9857, lon: 23.6792, tk: cleanTk };
        }

        // Decode Google Polyline format for OpenTripPlanner geometries
        function decodePolyline(encoded) {
            let points = [];
            let index = 0, len = encoded.length;
            let lat = 0, lng = 0;
            while (index < len) {
                let b, shift = 0, result = 0;
                do {
                    b = encoded.charCodeAt(index++) - 63;
                    result |= (b & 0x1f) << shift;
                    shift += 5;
                } while (b >= 0x20);
                let dlat = ((result & 1) ? ~(result >> 1) : (result >> 1));
                lat += dlat;
                shift = 0;
                result = 0;
                do {
                    b = encoded.charCodeAt(index++) - 63;
                    result |= (b & 0x1f) << shift;
                    shift += 5;
                } while (b >= 0x20);
                let dlng = ((result & 1) ? ~(result >> 1) : (result >> 1));
                lng += dlng;
                points.push([lat / 1e5, lng / 1e5]);
            }
            return points;
        }

        async function fetchOSRM(port, profile, start, end) {
            try {
                const url = `http://localhost:${port}/route/v1/${profile}/${start.lon},${start.lat};${end.lon},${end.lat}?overview=full&geometries=geojson`;
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    if (data.routes && data.routes.length > 0) {
                        return data.routes[0];
                    }
                }
            } catch (e) {
                console.warn(`OSRM Docker Engine Port ${port} Offline. Using Haversine Fallback.`);
            }

            const R = 6371.0;
            const phi1 = start.lat * Math.PI / 180;
            const phi2 = end.lat * Math.PI / 180;
            const dphi = (end.lat - start.lat) * Math.PI / 180;
            const dlambda = (end.lon - start.lon) * Math.PI / 180;
            const a = Math.sin(dphi/2)**2 + Math.cos(phi1)*Math.cos(phi2)*Math.sin(dlambda/2)**2;
            const straightKm = 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const multiplier = (profile === 'walking') ? 1.25 : 1.35;
            const distMeters = straightKm * multiplier * 1000;
            const speedKmh = (profile === 'walking') ? 4.3 : 16.75;
            const durSeconds = (distMeters / 1000 / speedKmh) * 3600;

            return {
                distance: distMeters,
                duration: durSeconds,
                geometry: {
                    coordinates: [
                        [start.lon, start.lat],
                        [end.lon, end.lat]
                    ]
                }
            };
        }

        // Query OpenTripPlanner GraphQL API
        async function fetchOTP(start, end, date, time) {
            const url = 'http://localhost:8080/otp/routers/default/index/graphql';
            const query = `
            {
              plan(
                from: { lat: ${start.lat}, lon: ${start.lon} },
                to: { lat: ${end.lat}, lon: ${end.lon} },
                date: "${date}",
                time: "${time}",
                walkReluctance: 5.0
              ) {
                itineraries {
                  startTime
                  duration
                  waitingTime
                  walkTime
                  legs {
                    mode
                    duration
                    distance
                    transitLeg
                    from { name lat lon }
                    to { name lat lon }
                    legGeometry { points }
                    route { shortName longName }
                  }
                }
              }
            }
            `;
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data.data && data.data.plan) {
                        return data.data.plan.itineraries || [];
                    }
                }
            } catch (e) {
                console.warn("OpenTripPlanner Offline. Using empirical fallback.");
                return null;
            }
            return [];
        }

        // Formatter: converts minutes >= 60 to "X hr Y min" (like Google Maps)
        function formatDuration(minutes) {
            if (minutes === null || minutes === undefined || isNaN(minutes) || Number(minutes) >= 9999) return 'N/A';
            const totalMin = Math.round(Number(minutes));
            if (totalMin < 60) {
                return `${totalMin} min`;
            }
            const hours = Math.floor(totalMin / 60);
            const mins = totalMin % 60;
            if (mins === 0) {
                return `${hours} hr`;
            }
            return `${hours} hr ${mins} min`;
        }

        // Helper to generate dynamic HTML steps for OTP itineraries
        function generateTransitStepsHTML(legs, tk1, tk2) {
            if (!legs || legs.length === 0) return '';
            return legs.map((leg, index) => {
                let tag = 'Walk';
                let title = 'Walk';
                let subtext = '';
                
                if (leg.mode === 'WALK') {
                    tag = 'Walk';
                    title = index === 0 ? 'Walk to station/stop' : (index === legs.length - 1 ? 'Walk to Campus' : 'Walk transfer');
                    subtext = `From ${leg.from.name || 'Origin'} to ${leg.to.name || 'Destination'}`;
                } else if (leg.mode === 'BUS') {
                    tag = 'Bus';
                    title = `Board Bus ${leg.route?.shortName || ''}`;
                    subtext = `${leg.route?.longName || ''}<br/>From <b>${leg.from.name}</b> to <b>${leg.to.name}</b>`;
                } else if (leg.mode === 'SUBWAY' || leg.mode === 'TRAM' || leg.mode === 'RAIL') {
                    tag = leg.mode === 'SUBWAY' ? 'Metro' : (leg.mode === 'TRAM' ? 'Tram' : 'Train');
                    title = `Board ${tag} ${leg.route?.shortName || ''}`;
                    subtext = `${leg.route?.longName || ''}<br/>From <b>${leg.from.name}</b> to <b>${leg.to.name}</b>`;
                }
                
                const durMin = Math.round(leg.duration / 60);
                
                return `
                <div class="step-row">
                    <div>
                        <span class="step-tag">${tag}</span>
                        <span class="step-title-text">${title}</span>
                        <div class="step-subtext" style="font-size: 0.72rem; color: var(--text-muted); margin-top: 2px;">${subtext}</div>
                    </div>
                    <span class="step-meta">${formatDuration(durMin)}</span>
                </div>`;
            }).join('');
        }

        async function drawLegOnMap(reqId, port, profile, p1, p2, color, dashArray = null, weight = 6) {
            if (reqId !== currentMapRequestId) return;
            const r = await fetchOSRM(port, profile, p1, p2);
            if (reqId !== currentMapRequestId) return;

            if (r && r.geometry) {
                const coords = r.geometry.coordinates.map(c => [c[1], c[0]]);
                const underlay = L.polyline(coords, { color: '#090d16', weight: weight + 3, opacity: 0.75 }).addTo(map);
                const poly = L.polyline(coords, { color, weight, opacity: 1.0, dashArray }).addTo(map);
                mapLayers.push(underlay, poly);
            }
        }

        function KNOWN_STATION_NAMES(tk) {
            const cleanTk = tk.trim();
            if (KNOWN_STATIONS[cleanTk]) return KNOWN_STATIONS[cleanTk];
            return {
                area: `Postal Area TK ${cleanTk}`,
                busStop: `OSY Stop TK ${cleanTk}`,
                metroStation: `Metro Station TK ${cleanTk}`
            };
        }

        async function calculateRoute() {
            const tk1 = document.getElementById('tkStart').value.trim();
            const tk2 = document.getElementById('tkEnd').value.trim();
            let timeStr = document.getElementById('timeScenario').value;
            if (timeStr === 'live') {
                const now = new Date();
                timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            }
            const hour = parseInt(timeStr.split(':')[0]);
            const isPeak = (hour >= 8 && hour < 10) || (hour >= 16 && hour < 18);

            const loadingState = document.getElementById('loadingState');
            const resultsDiv = document.getElementById('results');

            loadingState.style.display = 'block';
            resultsDiv.innerHTML = '';

            const start = await geocode(tk1, false);
            const end = await geocode(tk2, true);

            const carRoute = await fetchOSRM(5000, 'driving', start, end);
            const footRoute = await fetchOSRM(5001, 'walking', start, end);

            loadingState.style.display = 'none';

            // Query OpenTripPlanner
            const dateStr = "2026-07-22"; // Wednesday target
            const otpItineraries = await fetchOTP(start, end, dateStr, timeStr);
            const otpOnline = (otpItineraries !== null);

            let t1_otp = null;
            let t2_otp = null;

            const safeItineraries = otpItineraries || [];
            
            for (const itin of safeItineraries) {
                const legs = itin.legs || [];
                const hasMetro = legs.some(leg => ['SUBWAY', 'TRAM', 'RAIL'].includes(leg.mode));
                const hasBus = legs.some(leg => leg.mode === 'BUS');

                // Calculate CO2
                const EF_BUS = 3.6;
                const EF_METRO = 1.74;
                let co2_g = 0;
                legs.forEach(leg => {
                    const distKm = leg.distance / 1000;
                    let legDurMin = leg.duration / 60.0;
                    if (leg.mode === 'BUS') co2_g += legDurMin * EF_BUS;
                    else if (['SUBWAY', 'TRAM', 'RAIL'].includes(leg.mode)) co2_g += legDurMin * EF_METRO;
                });

                const durMin = Math.round(itin.duration / 60);
                const apiWaitMin = Math.round(itin.waitingTime / 60);
                const walkMin = Math.round(itin.walkTime / 60);
                const inVehicleMin = Math.max(0, durMin - apiWaitMin - walkMin);

                // Calculate initial wait time (time from requested time until you must leave your house)
                const requestedDate = new Date(`${dateStr}T${timeStr}:00`);
                const requestedEpoch = requestedDate.getTime();
                const initialWaitMs = Math.max(0, itin.startTime - requestedEpoch);
                const initialWaitMin = Math.round(initialWaitMs / 60000);

                const totalWaitMin = apiWaitMin + initialWaitMin;
                const totalDurMin = durMin + initialWaitMin;

                if (hasMetro) {
                    if (!t1_otp || totalDurMin < t1_otp.dur) {
                        t1_otp = { dur: totalDurMin, wait: totalWaitMin, walk: walkMin, inVehicle: inVehicleMin, co2: Math.round(co2_g), legs };
                    }
                } else if (hasBus) {
                    if (!t2_otp || totalDurMin < t2_otp.dur) {
                        t2_otp = { dur: totalDurMin, wait: totalWaitMin, walk: walkMin, inVehicle: inVehicleMin, co2: Math.round(co2_g), legs };
                    }
                }
            }

            const startStationInfo = KNOWN_STATION_NAMES(tk1);
            const endStationInfo = KNOWN_STATION_NAMES(tk2);

            const busStop1 = { lat: start.lat + 0.002, lon: start.lon + 0.002, name: startStationInfo.busStop };
            const metroStation1 = { lat: start.lat + 0.004, lon: start.lon + 0.004, name: startStationInfo.metroStation };
            const busStop2 = { lat: end.lat - 0.002, lon: end.lon - 0.002, name: endStationInfo.busStop };

            currentRoutesData = { 
                start, end, carRoute, footRoute, tk1, tk2, 
                busStop1, metroStation1, busStop2,
                t1_legs: t1_otp ? t1_otp.legs : null,
                t2_legs: t2_otp ? t2_otp.legs : null
            };

            const carMultiplier = isPeak ? 1.45 : 1.0;
            const metroWait1 = isPeak ? 4 : 6;
            const busWait1 = isPeak ? 7 : 11;

            const EF_CAR   = 60.0;
            const EF_MOTO  = 40.8;
            const EF_BUS   = 3.6;
            const EF_METRO = 1.74;

            const carDistKm = carRoute ? (carRoute.distance / 1000) : 2.5;
            const carDurMin = carRoute ? (carRoute.duration / 60 * carMultiplier) : (10.0 * carMultiplier);
            const roleElem = document.getElementById('passengerRole');
            const contextMultiplier = roleElem ? parseFloat(roleElem.value) : 1.0;
            const carCO2Grams = Math.round(carDurMin * EF_CAR * contextMultiplier);

            const motoDistKm = carDistKm;
            const motoDurMin = carDurMin * 0.90;
            const motoCO2Grams = Math.round(motoDurMin * EF_MOTO);

            const footDistKm = footRoute ? (footRoute.distance / 1000) : 1.8;
            const footDurMin = footRoute ? Math.round(footRoute.duration / 60) : 22;

            const straightKm = Math.sqrt(Math.pow((start.lat - end.lat)*111, 2) + Math.pow((start.lon - end.lon)*88, 2));
            const busDistKm = (straightKm * 1.15);

            // Transit 1 (Metro + Bus) Duration & Metrics
            let t1_totalDur, t1_inVehicleTotal, t1_waitTotal, t1_walkTotal, t1_co2Grams, t1_stepsHTML;
            if (t1_otp) {
                t1_totalDur = t1_otp.dur;
                t1_inVehicleTotal = t1_otp.inVehicle;
                t1_waitTotal = t1_otp.wait;
                t1_walkTotal = t1_otp.walk;
                t1_co2Grams = t1_otp.co2;
                t1_stepsHTML = generateTransitStepsHTML(t1_otp.legs, tk1, tk2);
            } else if (!otpOnline) {
                const t1_walk1 = 4;
                const t1_wait1 = metroWait1;
                const t1_inMetro = Math.max(3, Math.round(straightKm * 1.5));
                const t1_wait2 = busWait1;
                const t1_inBus = Math.max(4, Math.round(straightKm * 1.8 * (isPeak ? 1.0 : 0.8)));
                const t1_walk2 = 3;
                t1_inVehicleTotal = t1_inMetro + t1_inBus;
                t1_waitTotal = t1_wait1 + t1_wait2;
                t1_walkTotal = t1_walk1 + t1_walk2;
                t1_totalDur = t1_walkTotal + t1_waitTotal + t1_inVehicleTotal;
                t1_co2Grams = Math.round((t1_totalDur * 0.5 * EF_METRO) + (t1_totalDur * 0.5 * EF_BUS));
                t1_stepsHTML = `
                    <div class="step-row"><div><span class="step-tag">Walk</span><span class="step-title-text">Walk to Bus Stop</span><div class="step-subtext">Origin (TK ${tk1})</div></div><span class="step-meta">${t1_walk1} min</span></div>
                    <div class="step-row"><div><span class="step-tag">Wait</span><span class="step-title-text">Wait at OSY Stop</span><div class="step-subtext">${busStop1.name}</div></div><span class="step-meta">${t1_wait1} min</span></div>
                    <div class="step-row"><div><span class="step-tag">Metro</span><span class="step-title-text">Metro Line (Est.)</span><div class="step-subtext">${metroStation1.name}</div></div><span class="step-meta">${t1_inMetro} min</span></div>
                    <div class="step-row"><div><span class="step-tag">Transfer</span><span class="step-title-text">Transfer to connecting Bus</span><div class="step-subtext">Bus Transfer Node</div></div><span class="step-meta">${t1_wait2} min</span></div>
                    <div class="step-row"><div><span class="step-tag">Bus</span><span class="step-title-text">Bus (Est.)</span><div class="step-subtext">To ${busStop2.name}</div></div><span class="step-meta">${t1_inBus} min</span></div>
                    <div class="step-row"><div><span class="step-tag">Walk</span><span class="step-title-text">Walk to Campus</span><div class="step-subtext">Destination (TK ${tk2})</div></div><span class="step-meta">${t1_walk2} min</span></div>
                `;
            } else {
                t1_totalDur = 9999;
                t1_inVehicleTotal = 9999;
                t1_waitTotal = 9999;
                t1_walkTotal = 9999;
                t1_co2Grams = 0;
                t1_stepsHTML = `<div class="step-row"><span class="step-tag" style="background:#e11d48">N/A</span><span class="step-title-text">No route found</span></div>`;
            }

            // Transit 2 (Direct Bus) Duration & Metrics
            let t2_totalDur, t2_inVehicleTotal, t2_waitTotal, t2_walkTotal, t2_co2Grams, t2_stepsHTML;
            if (t2_otp) {
                t2_totalDur = t2_otp.dur;
                t2_inVehicleTotal = t2_otp.inVehicle;
                t2_waitTotal = t2_otp.wait;
                t2_walkTotal = t2_otp.walk;
                t2_co2Grams = t2_otp.co2;
                t2_stepsHTML = generateTransitStepsHTML(t2_otp.legs, tk1, tk2);
            } else if (!otpOnline) {
                const t2_walk1 = 5;
                const t2_wait1 = isPeak ? 9 : 14;
                const t2_inBus = Math.max(8, Math.round(straightKm * 3.1 * (isPeak ? 1.0 : 0.8)));
                const t2_walk2 = 4;
                t2_inVehicleTotal = t2_inBus;
                t2_waitTotal = t2_wait1;
                t2_walkTotal = t2_walk1 + t2_walk2;
                t2_totalDur = t2_walkTotal + t2_waitTotal + t2_inVehicleTotal;
                t2_co2Grams = Math.round(t2_totalDur * EF_BUS);
                t2_stepsHTML = `
                    <div class="step-row"><div><span class="step-tag">Walk</span><span class="step-title-text">Walk to Bus Stop</span><div class="step-subtext">Origin (TK ${tk1})</div></div><span class="step-meta">${t2_walk1} min</span></div>
                    <div class="step-row"><div><span class="step-tag">Wait</span><span class="step-title-text">Wait at OSY Stop</span><div class="step-subtext">${busStop1.name}</div></div><span class="step-meta">${t2_wait1} min</span></div>
                    <div class="step-row"><div><span class="step-tag">Bus</span><span class="step-title-text">Bus Line (Est.)</span><div class="step-subtext">To ${busStop2.name}</div></div><span class="step-meta">${t2_inBus} min</span></div>
                    <div class="step-row"><div><span class="step-tag">Walk</span><span class="step-title-text">Walk to Campus</span><div class="step-subtext">Destination (TK ${tk2})</div></div><span class="step-meta">${t2_walk2} min</span></div>
                `;
            } else {
                t2_totalDur = 9999;
                t2_inVehicleTotal = 9999;
                t2_waitTotal = 9999;
                t2_walkTotal = 9999;
                t2_co2Grams = 0;
                t2_stepsHTML = `<div class="step-row"><span class="step-tag" style="background:#e11d48">N/A</span><span class="step-title-text">No route found</span></div>`;
            }

            const carSelect = document.getElementById('hasCar').value;
            const motoSelect = document.getElementById('hasMoto').value;

            const ASC_CAR   = 6.0;
            const ASC_MOTO  = 9.0;
            const ASC_T1    = -4.0;
            const ASC_T2    = -2.0;
            const ASC_FOOT  = 0.0;

            const C_car  = (carDurMin + 4.0) + (Math.pow(carDistKm, 0.85) * 0.35 * 5) + ASC_CAR;
            const C_moto = (motoDurMin + 1.0) + (Math.pow(carDistKm, 0.85) * 0.18 * 5) + (carDistKm * 0.8) + ASC_MOTO;
            const C_t1   = (t1_inVehicleTotal + t1_walkTotal) + (1.2 * t1_waitTotal) + 4.0 + ASC_T1;
            const C_t2   = (t2_inVehicleTotal + t2_walkTotal) + (1.2 * t2_waitTotal) + ASC_T2;
            const C_foot = footDurMin * 1.1 + ASC_FOOT;

            let footBias = 0;
            if (footDistKm <= 0.6) footBias = -30.0;
            else if (footDistKm <= 1.0) footBias = -12.0;
            else if (footDistKm <= 1.5) footBias = 0.0;
            else footBias = 30.0;

            const C_foot_adj = C_foot + footBias;

            const theta = 0.09;

            const getProbs = (c, m) => {
                const expC  = c ? Math.exp(-theta * C_car) : 0.0;
                const expM  = m ? Math.exp(-theta * C_moto) : 0.0;
                const expT1 = Math.exp(-theta * C_t1);
                const expT2 = Math.exp(-theta * C_t2);
                const expF  = Math.exp(-theta * C_foot_adj);
                const sumE  = expC + expM + expT1 + expT2 + expF;
                return {
                    pC: expC / sumE,
                    pM: expM / sumE,
                    pT1: expT1 / sumE,
                    pT2: expT2 / sumE,
                    pF: expF / sumE
                };
            };

            let pCar = 0, pMoto = 0, pT1 = 0, pT2 = 0, pFoot = 0;
            
            // Expected probabilities based on population segments
            let w_car = (carSelect === 'yes') ? 1.0 : (carSelect === 'no' ? 0.0 : 0.20);
            let w_moto = (motoSelect === 'yes') ? 1.0 : (motoSelect === 'no' ? 0.0 : 0.15);
            
            const segments = [
                { c: true,  m: true,  w: w_car * w_moto },
                { c: true,  m: false, w: w_car * (1.0 - w_moto) },
                { c: false, m: true,  w: (1.0 - w_car) * w_moto },
                { c: false, m: false, w: (1.0 - w_car) * (1.0 - w_moto) }
            ];
            
            for (let seg of segments) {
                if (seg.w <= 0) continue;
                let probs = getProbs(seg.c, seg.m);
                pCar += probs.pC * seg.w;
                pMoto += probs.pM * seg.w;
                pT1 += probs.pT1 * seg.w;
                pT2 += probs.pT2 * seg.w;
                pFoot += probs.pF * seg.w;
            }

            const totalP = pCar + pMoto + pT1 + pT2 + pFoot;
            const pctCar  = Math.round((pCar / totalP) * 100);
            const pctMoto = Math.round((pMoto / totalP) * 100);
            const pctT1   = Math.round((pT1 / totalP) * 100);
            const pctT2   = Math.round((pT2 / totalP) * 100);
            const pctFoot = 100 - (pctCar + pctMoto + pctT1 + pctT2);

            const cardsData = [
                {
                    mode: 'transit1',
                    name: 'Metro + Bus Transit',
                    pct: pctT1,
                    dur: t1_totalDur,
                    co2: t1_co2Grams,
                    html: `
                <div class="card" id="card-transit1" ${t1_totalDur !== 9999 ? `onclick="showOnMap('transit1')"` : `style="cursor:not-allowed; opacity:0.7;"`}>
                    <div class="card-header">
                        <span class="mode-title">Metro + Bus Transit</span>
                        <span class="card-badge">Logit: ${pctT1}% P(i)</span>
                    </div>
                    ${t1_totalDur !== 9999 ? `
                    <div class="card-metrics">
                        <div class="metric"><span class="metric-val">${formatDuration(t1_totalDur)}</span><span class="metric-lbl">Total Time</span></div>
                        <div class="metric"><span class="metric-val">${formatDuration(t1_inVehicleTotal)}</span><span class="metric-lbl">In-Vehicle</span></div>
                        <div class="metric"><span class="metric-val">${formatDuration(t1_waitTotal)}</span><span class="metric-lbl">Wait Time</span></div>
                    </div>
                    <div class="co2-box">
                        <span class="co2-lbl">Carbon Footprint (per pax):</span>
                        <span class="co2-val">${t1_co2Grams} g CO₂</span>
                    </div>
                    ` : ''}
                    <div class="steps-flow">
                        ${t1_stepsHTML}
                    </div>
                </div>`
                },
                {
                    mode: 'transit2',
                    name: 'Bus-Only Transit',
                    pct: pctT2,
                    dur: t2_totalDur,
                    co2: t2_co2Grams,
                    html: `
                <div class="card" id="card-transit2" ${t2_totalDur !== 9999 ? `onclick="showOnMap('transit2')"` : `style="cursor:not-allowed; opacity:0.7;"`}>
                    <div class="card-header">
                        <span class="mode-title">Bus-Only Transit</span>
                        <span class="card-badge">Logit: ${pctT2}% P(i)</span>
                    </div>
                    ${t2_totalDur !== 9999 ? `
                    <div class="card-metrics">
                        <div class="metric"><span class="metric-val">${formatDuration(t2_totalDur)}</span><span class="metric-lbl">Total Time</span></div>
                        <div class="metric"><span class="metric-val">${formatDuration(t2_inVehicleTotal)}</span><span class="metric-lbl">In-Vehicle</span></div>
                        <div class="metric"><span class="metric-val">${formatDuration(t2_waitTotal)}</span><span class="metric-lbl">Wait Time</span></div>
                    </div>
                    <div class="co2-box">
                        <span class="co2-lbl">Carbon Footprint (per pax):</span>
                        <span class="co2-val">${t2_co2Grams} g CO₂</span>
                    </div>
                    ` : ''}
                    <div class="steps-flow">
                        ${t2_stepsHTML}
                    </div>
                </div>`
                },
                {
                    mode: 'car',
                    name: 'Private Car (1.25 pax)',
                    pct: pctCar,
                    dur: carDurMin,
                    co2: carCO2Grams,
                    html: `
                <div class="card" id="card-car" onclick="showOnMap('car')">
                    <div class="card-header">
                        <span class="mode-title">Private Car (${contextMultiplier === 0.5 ? 'Carpool 0.5x' : (contextMultiplier === 2.0 ? 'Drop-off 2.0x' : 'Solo')})</span>
                        <span class="card-badge">Logit: ${pctCar}% P(i)</span>
                    </div>
                    <div class="card-metrics">
                        <div class="metric"><span class="metric-val">${carDistKm.toFixed(2)} km</span><span class="metric-lbl">Distance</span></div>
                        <div class="metric"><span class="metric-val">${formatDuration(carDurMin)}</span><span class="metric-lbl">Drive Time</span></div>
                        <div class="metric"><span class="metric-val">60 g</span><span class="metric-lbl">EF (g/pax-min)</span></div>
                    </div>
                    <div class="co2-box">
                        <span class="co2-lbl">Carbon Footprint:</span>
                        <span class="co2-val">${carCO2Grams} g CO₂</span>
                    </div>
                </div>`
                },
                {
                    mode: 'moto',
                    name: 'Motorcycle (1.0 pax)',
                    pct: pctMoto,
                    dur: motoDurMin,
                    co2: motoCO2Grams,
                    html: `
                <div class="card" id="card-moto" onclick="showOnMap('moto')">
                    <div class="card-header">
                        <span class="mode-title">Motorcycle</span>
                        <span class="card-badge">Logit: ${pctMoto}% P(i)</span>
                    </div>
                    <div class="card-metrics">
                        <div class="metric"><span class="metric-val">${motoDistKm.toFixed(2)} km</span><span class="metric-lbl">Distance</span></div>
                        <div class="metric"><span class="metric-val">${formatDuration(motoDurMin)}</span><span class="metric-lbl">Travel Time</span></div>
                        <div class="metric"><span class="metric-val">40.8 g</span><span class="metric-lbl">EF (g/pax-min)</span></div>
                    </div>
                    <div class="co2-box">
                        <span class="co2-lbl">Carbon Footprint:</span>
                        <span class="co2-val">${motoCO2Grams} g CO₂</span>
                    </div>
                </div>`
                },
                {
                    mode: 'foot',
                    name: 'Pedestrian (Walk-Only)',
                    pct: pctFoot,
                    dur: footDurMin,
                    co2: 0,
                    html: `
                <div class="card" id="card-foot" onclick="showOnMap('foot')">
                    <div class="card-header">
                        <span class="mode-title">Pedestrian Walk</span>
                        <span class="card-badge">Logit: ${pctFoot}% P(i)</span>
                    </div>
                    <div class="card-metrics">
                        <div class="metric"><span class="metric-val">${footDistKm.toFixed(2)} km</span><span class="metric-lbl">Walk Distance</span></div>
                        <div class="metric"><span class="metric-val">${formatDuration(footDurMin)}</span><span class="metric-lbl">Walk Time</span></div>
                        <div class="metric"><span class="metric-val">0 g</span><span class="metric-lbl">EF (g/pax-min)</span></div>
                    </div>
                    <div class="co2-box">
                        <span class="co2-lbl">Carbon Footprint:</span>
                        <span class="co2-val">0 g CO₂</span>
                    </div>
                </div>`
                }
            ];

            cardsData.sort((a, b) => b.pct - a.pct);

            const selectedRoute = cardsData[0];

            resultsDiv.innerHTML = `
                <!-- MONOCHROME MINIMALIST SELECTED ROUTE CARD -->
                <div class="card active" id="card-selected" onclick="showOnMap('${selectedRoute.mode}')">
                    <div style="font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); margin-bottom: 4px;">
                        SELECTED OPTIMAL ROUTE (LOGIT MODEL)
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 1.05rem; font-weight: 700; color: #ffffff;">${selectedRoute.name}</span>
                        <span style="background: #38bdf8; color: #030712; padding: 3px 10px; border-radius: 4px; font-weight: 800; font-size: 0.82rem;">
                            P(i) = ${selectedRoute.pct}%
                        </span>
                    </div>
                    <div style="display: flex; gap: 20px; margin-top: 8px; font-size: 0.82rem; color: var(--text-muted);">
                        <span>Duration: <b style="color: #ffffff;">${formatDuration(selectedRoute.dur)}</b></span>
                        <span>Emissions: <b style="color: #38bdf8;">${selectedRoute.co2} g CO₂</b></span>
                    </div>
                </div>

                <!-- SORTED ROUTE CARDS -->
                ${cardsData.map(c => c.html).join('')}
            `;

            await showOnMap(selectedRoute.mode);
        }

        async function showOnMap(mode) {
            if (!currentRoutesData) return;
            clearMap();
            const reqId = currentMapRequestId;

            const { start, end, carRoute, footRoute, tk1, tk2, busStop1, metroStation1, busStop2 } = currentRoutesData;

            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            const activeCard = document.getElementById(`card-${mode}`);
            if (activeCard) activeCard.classList.add('active');

            const bounds = L.latLngBounds([[start.lat, start.lon], [end.lat, end.lon]]);

            function getDestinationLabel(tk) {
                if (UNIVERSITY_DESTINATIONS[tk]) {
                    return `<b>Destination:</b> ${UNIVERSITY_DESTINATIONS[tk].name}<br/><span style="font-size:0.75rem; color:#94a3b8;">${UNIVERSITY_DESTINATIONS[tk].campus}</span>`;
                }
                return `<b>Destination:</b> TK ${tk}`;
            }

            function addMarker(lat, lon, popupHtml) {
                if (reqId !== currentMapRequestId) return;
                const m = L.marker([lat, lon]).addTo(map).bindPopup(popupHtml);
                mapLayers.push(m);
            }

            if (mode === 'car' && carRoute) {
                if (reqId !== currentMapRequestId) return;
                const coords = carRoute.geometry.coordinates.map(c => [c[1], c[0]]);
                const u = L.polyline(coords, { color: '#090d16', weight: 8, opacity: 0.75 }).addTo(map);
                const p = L.polyline(coords, { color: '#0284c7', weight: 6, opacity: 1.0 }).addTo(map);
                mapLayers.push(u, p);
                addMarker(start.lat, start.lon, `<b>Origin:</b> TK ${tk1}`);
                addMarker(end.lat, end.lon, getDestinationLabel(tk2));
            } 
            else if (mode === 'moto' && carRoute) {
                if (reqId !== currentMapRequestId) return;
                const coords = carRoute.geometry.coordinates.map(c => [c[1], c[0]]);
                const u = L.polyline(coords, { color: '#090d16', weight: 8, opacity: 0.75 }).addTo(map);
                const p = L.polyline(coords, { color: '#d946ef', weight: 6, opacity: 1.0 }).addTo(map);
                mapLayers.push(u, p);
                addMarker(start.lat, start.lon, `<b>Origin:</b> TK ${tk1}`);
                addMarker(end.lat, end.lon, getDestinationLabel(tk2));
            }
            else if (mode === 'foot' && footRoute) {
                if (reqId !== currentMapRequestId) return;
                const coords = footRoute.geometry.coordinates.map(c => [c[1], c[0]]);
                const u = L.polyline(coords, { color: '#090d16', weight: 7, opacity: 0.75 }).addTo(map);
                const p = L.polyline(coords, { color: '#059669', weight: 5, opacity: 1.0, dashArray: '6, 6' }).addTo(map);
                mapLayers.push(u, p);
                addMarker(start.lat, start.lon, `<b>Origin:</b> TK ${tk1}`);
                addMarker(end.lat, end.lon, getDestinationLabel(tk2));
            }
            else if (mode === 'transit1') {
                if (currentRoutesData.t1_legs) {
                    for (const leg of currentRoutesData.t1_legs) {
                        const coords = decodePolyline(leg.legGeometry.points);
                        let color = '#3b82f6'; // default
                        let dashArray = null;
                        let weight = 6;
                        if (leg.mode === 'WALK') {
                            color = '#059669';
                            dashArray = '6, 6';
                            weight = 4;
                        } else if (leg.mode === 'BUS') {
                            color = '#f59e0b';
                        } else if (leg.mode === 'SUBWAY') {
                            color = '#ef4444';
                        } else if (leg.mode === 'TRAM') {
                            color = '#10b981';
                        }
                        const underlay = L.polyline(coords, { color: '#090d16', weight: weight + 3, opacity: 0.75 }).addTo(map);
                        const poly = L.polyline(coords, { color, weight, opacity: 1.0, dashArray }).addTo(map);
                        mapLayers.push(underlay, poly);
                        
                        if (leg.transitLeg) {
                            addMarker(leg.from.lat, leg.from.lon, `<b>${leg.mode}: ${leg.from.name}</b><br/>Board ${leg.route?.shortName || ''}`);
                            addMarker(leg.to.lat, leg.to.lon, `<b>Arrival: ${leg.to.name}</b>`);
                        }
                    }
                    addMarker(start.lat, start.lon, `<b>Origin:</b> TK ${tk1}`);
                    addMarker(end.lat, end.lon, getDestinationLabel(tk2));
                } else {
                    await drawLegOnMap(reqId, 5001, 'walking', start, busStop1, '#059669', '6, 6', 4);
                    await drawLegOnMap(reqId, 5000, 'driving', busStop1, metroStation1, '#9333ea', null, 6);
                    await drawLegOnMap(reqId, 5000, 'driving', metroStation1, busStop2, '#d97706', null, 6);
                    await drawLegOnMap(reqId, 5001, 'walking', busStop2, end, '#059669', '6, 6', 4);

                    if (reqId !== currentMapRequestId) return;
                    addMarker(start.lat, start.lon, `<b>Origin:</b> TK ${tk1}`);
                    addMarker(busStop1.lat, busStop1.lon, `<b>OSY Stop: ${busStop1.name}</b><br/>Board Transit Line (Est.)`);
                    addMarker(metroStation1.lat, metroStation1.lon, `<b>Metro: ${metroStation1.name}</b><br/>Transfer to connecting Bus`);
                    addMarker(busStop2.lat, busStop2.lon, `<b>OSY Stop: ${busStop2.name}</b><br/>Walk to campus`);
                    addMarker(end.lat, end.lon, getDestinationLabel(tk2));
                }
            }
            else if (mode === 'transit2') {
                if (currentRoutesData.t2_legs) {
                    for (const leg of currentRoutesData.t2_legs) {
                        const coords = decodePolyline(leg.legGeometry.points);
                        let color = '#3b82f6'; // default
                        let dashArray = null;
                        let weight = 6;
                        if (leg.mode === 'WALK') {
                            color = '#059669';
                            dashArray = '6, 6';
                            weight = 4;
                        } else if (leg.mode === 'BUS') {
                            color = '#f59e0b';
                        }
                        const underlay = L.polyline(coords, { color: '#090d16', weight: weight + 3, opacity: 0.75 }).addTo(map);
                        const poly = L.polyline(coords, { color, weight, opacity: 1.0, dashArray }).addTo(map);
                        mapLayers.push(underlay, poly);
                        
                        if (leg.transitLeg) {
                            addMarker(leg.from.lat, leg.from.lon, `<b>${leg.mode}: ${leg.from.name}</b><br/>Board ${leg.route?.shortName || ''}`);
                            addMarker(leg.to.lat, leg.to.lon, `<b>Arrival: ${leg.to.name}</b>`);
                        }
                    }
                    addMarker(start.lat, start.lon, `<b>Origin:</b> TK ${tk1}`);
                    addMarker(end.lat, end.lon, getDestinationLabel(tk2));
                } else {
                    await drawLegOnMap(reqId, 5001, 'walking', start, busStop1, '#059669', '6, 6', 4);
                    await drawLegOnMap(reqId, 5000, 'driving', busStop1, busStop2, '#d97706', null, 6);
                    await drawLegOnMap(reqId, 5001, 'walking', busStop2, end, '#059669', '6, 6', 4);

                    if (reqId !== currentMapRequestId) return;
                    addMarker(start.lat, start.lon, `<b>Origin:</b> TK ${tk1}`);
                    addMarker(busStop1.lat, busStop1.lon, `<b>OSY Stop: ${busStop1.name}</b><br/>Board Transit Line (Est.)`);
                    addMarker(busStop2.lat, busStop2.lon, `<b>OSY Stop: ${busStop2.name}</b><br/>Walk to campus`);
                    addMarker(end.lat, end.lon, getDestinationLabel(tk2));
                }
            }

            if (reqId === currentMapRequestId) {
                map.fitBounds(bounds, { padding: [60, 60] });
            }
        }

        let clockInterval;
        let isLiveTime = true;
        let lastCalculatedLiveMinute = -1;
        
        function updateClock() {
            const now = new Date();
            const currentStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            
            const liveOption = document.getElementById('liveTimeOption');
            if (liveOption) {
                liveOption.textContent = `Now (${currentStr})`;
            }

            if (isLiveTime && now.getMinutes() !== lastCalculatedLiveMinute) {
                lastCalculatedLiveMinute = now.getMinutes();
                if (lastCalculatedLiveMinute !== -1) {
                    calculateRoute();
                }
            }
        }

        function handleTimeChange() {
            const val = document.getElementById('timeScenario').value;
            if (val === 'live') {
                isLiveTime = true;
                const now = new Date();
                lastCalculatedLiveMinute = now.getMinutes();
            } else {
                isLiveTime = false;
            }
            calculateRoute();
        }

        // Initialize clock
        updateClock();
        clockInterval = setInterval(updateClock, 1000);

        window.onload = calculateRoute;
    </script>
</body>
</html>
