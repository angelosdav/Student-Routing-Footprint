<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSRM Transit Router Attica UNIWA</title>
    <!-- Google Fonts & Leaflet CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            /* Deep OLED Slate Palette, Rich Depth & High Contrast */
            --bg-color: #030712;
            --panel-bg: rgba(15, 23, 42, 0.95);
            --card-bg: rgba(30, 41, 59, 0.65);
            --card-hover-bg: rgba(30, 41, 59, 0.95);
            --border-color: rgba(255, 255, 255, 0.1);
            --border-active: #38bdf8;

            /* Text */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;

            /* Geometry */
            --shadow-card: 0 8px 24px -6px rgba(0, 0, 0, 0.5);
            --radius-lg: 10px;
            --radius-md: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* Sleek custom scrollbars */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #030712;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        #sidebar {
            width: 480px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 1000;
            box-shadow: 8px 0 32px rgba(0, 0, 0, 0.8);
            overflow-y: auto;
        }

        .header {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.30rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }

        .header p {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .input-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-field label {
            font-size: 0.70rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
        }

        .input-field input, .input-field select {
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            color: #ffffff;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .input-field input:focus, .input-field select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .btn-calc {
            background: #38bdf8;
            color: #030712;
            border: none;
            border-radius: var(--radius-md);
            padding: 12px;
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .btn-calc:hover {
            background: #7dd3fc;
        }

        .btn-calc:active {
            background: #0284c7;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: var(--shadow-card);
        }

        .card:hover {
            background: var(--card-hover-bg);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .card.active {
            border-color: var(--border-active);
            background: var(--card-hover-bg);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 0.94rem;
            color: #ffffff;
        }

        .mode-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-badge {
            font-size: 0.70rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 700;
            letter-spacing: 0.3px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .card-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            background: #090d16;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .metric {
            display: flex;
            flex-direction: column;
        }

        .metric-val {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
        }

        .metric-lbl {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .co2-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            font-size: 0.80rem;
        }

        .co2-lbl {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .co2-val {
            font-weight: 700;
            font-size: 0.90rem;
            color: #38bdf8;
        }

        .steps-flow {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 2px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            font-size: 0.78rem;
        }

        .step-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            padding: 8px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .step-tag {
            font-size: 0.64rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            margin-right: 6px;
        }

        .step-title-text {
            font-weight: 600;
            color: var(--text-main);
        }

        .step-subtext {
            font-size: 0.70rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .step-meta {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
        }

        #map {
            flex: 1;
            height: 100%;
            width: 100%;
        }

        .loading {
            display: none;
            text-align: center;
            color: #38bdf8;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 8px;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <h1>OSRM Transit Router</h1>
            <p>Multinomial Logit Choice Model & Fleet Emission Analytics (Athens Universities)</p>
        </div>

        <div class="input-group">
            <div class="input-grid">
                <div class="input-field">
                    <label>Origin Postal Code</label>
                    <input type="text" id="tkStart" value="12461" placeholder="e.g. 12461">
                </div>
                <div class="input-field">
                    <label>Destination University / Campus</label>
                    <select id="tkEnd" onchange="calculateRoute()">
                        <optgroup label="ΕΚΠΑ (Εθνικό & Καποδιστριακό)">
                            <option value="15784">Πανεπιστημιούπολη (Ζωγράφου) - 157 84</option>
                            <option value="11527">Γουδή (Επιστημών Υγείας) - 115 27</option>
                            <option value="10679">Κέντρο (Προπύλαια) - 106 79</option>
                            <option value="17237">Δάφνη (ΣΕΦΑΑ) - 172 37</option>
                        </optgroup>
                        <optgroup label="ΕΜΠ (Εθνικό Μετσόβιο Πολυτεχνείο)">
                            <option value="15780">Πολυτεχνειούπολη (Ζωγράφου) - 157 80</option>
                            <option value="10682">Πατησίων (Ιστορικό Συγκρότημα) - 106 82</option>
                        </optgroup>
                        <optgroup label="ΟΠΑ (Οικονομικό Πανεπιστήμιο Αθηνών)">
                            <option value="10434">Πατησίων (Κεντρικό Κτίριο) - 104 34</option>
                            <option value="11362">Ευελπίδων (Μεταπτυχιακά) - 113 62</option>
                            <option value="11257">Τροίας - 112 57</option>
                        </optgroup>
                        <optgroup label="ΠΑΔΑ (Πανεπιστήμιο Δυτικής Αττικής)">
                            <option value="12243" selected>Άλσος Αιγάλεω - 122 43</option>
                            <option value="12244">Αρχαίος Ελαιώνας - 122 44</option>
                            <option value="11521">Αμπελόκηποι (ΕΣΔΥ) - 115 21</option>
                        </optgroup>
                        <optgroup label="ΠΑΠΕΙ (Πανεπιστήμιο Πειραιώς)">
                            <option value="18534">Πειραιάς (Κεντρικό Κτίριο) - 185 34</option>
                            <option value="18532">Γρ. Λαμπράκη - 185 32</option>
                        </optgroup>
                        <optgroup label="Άλλα Πανεπιστήμια & Σχολές">
                            <option value="17121">Πάντειον Πανεπιστήμιο - 171 21</option>
                            <option value="11855">Γεωπονικό (Βοτανικός) - 118 55</option>
                            <option value="17676">Χαροκόπειο (Καλλιθέα) - 176 76</option>
                            <option value="18233">ΑΣΚΤ (Ταύρος) - 182 33</option>
                            <option value="10105">Σχολή Ικάρων (Τατόι) - 101 05</option>
                            <option value="18539">Σχολή Ναυτικών Δοκίμων - 185 39</option>
                            <option value="16673">Σχολή Ευελπίδων (Βάρη) - 166 73</option>
                        </optgroup>
                    </select>
                </div>
            </div>
            <div class="input-field">
                <label>Traffic Conditions / Time Scenario</label>
                <select id="timeScenario" onchange="calculateRoute()">
                    <option value="peak" selected>Peak Hours (08:00-10:00 / 16:00-18:00)</option>
                    <option value="offpeak">Off-Peak / Off-Peak Hours</option>
                </select>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px; margin: 4px 0;">
                <label style="font-size: 0.70rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted);">Vehicle Availability (Student constraints)</label>
                <div style="display: flex; gap: 16px;">
                    <label style="display: flex; align-items: center; gap: 6px; font-size: 0.82rem; cursor: pointer; color: var(--text-main);">
                        <input type="checkbox" id="hasCar" onchange="calculateRoute()" style="accent-color: #38bdf8; width: 15px; height: 15px;"> Private Car
                    </label>
                    <label style="display: flex; align-items: center; gap: 6px; font-size: 0.82rem; cursor: pointer; color: var(--text-main);">
                        <input type="checkbox" id="hasMoto" onchange="calculateRoute()" style="accent-color: #38bdf8; width: 15px; height: 15px;"> Motorcycle
                    </label>
                </div>
            </div>
            <button class="btn-calc" onclick="calculateRoute()">Calculate Optimal Routes</button>
            <div class="loading" id="loadingState">Querying OSRM cluster engines...</div>
        </div>

        <div class="results-container" id="results">
            <!-- Dynamic Cards inserted here -->
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const KNOWN_STATIONS = {
            "12241": { area: "Egaleo Campus 2", busStop: "OSY Stop 'UNIWA Campus 2'", metroStation: "Metro Station 'Egaleo' (Line 3)" },
            "12242": { area: "Egaleo Center", busStop: "OSY Stop 'Egaleo City Hall'", metroStation: "Metro Station 'Egaleo' (Line 3)" },
            "12243": { area: "Egaleo North", busStop: "OSY Stop 'Egaleo Bridge'", metroStation: "Metro Station 'Agia Marina' (Line 3)" },
            "12244": { area: "Egaleo Lioumi", busStop: "OSY Stop 'Lioumi Square'", metroStation: "Metro Station 'Agia Marina' (Line 3)" },
            "12461": { area: "Haidari", busStop: "OSY Stop 'Haidari Bridge'", metroStation: "Metro Station 'Agia Marina' (Line 3)" },
            "15124": { area: "Marousi", busStop: "OSY Stop 'Marousi Square'", metroStation: "Metro/ISAP Station 'Marousi' (Line 1)" },
            "17343": { area: "Agios Dimitrios", busStop: "OSY Stop 'Ag. Dimitrios Station'", metroStation: "Metro Station 'Agios Dimitrios' (Line 2)" },
            "10431": { area: "Omonoia", busStop: "OSY Stop 'Omonoia Square'", metroStation: "Metro Station 'Omonoia' (Line 1 & 2)" },
            "18531": { area: "Piraeus", busStop: "OSY Stop 'Piraeus Port'", metroStation: "Metro/ISAP Station 'Piraeus' (Line 1 & 3)" }
        };

        const KNOWN_COORDS = {
            "12241": { lat: 37.9857, lon: 23.6792 },
            "12242": { lat: 37.9920, lon: 23.6800 },
            "12243": { lat: 37.9984, lon: 23.6728 },
            "12244": { lat: 37.9904, lon: 23.6816 },
            "12461": { lat: 38.0086, lon: 23.6633 },
            "15124": { lat: 38.0515, lon: 23.8040 },
            "17343": { lat: 37.9395, lon: 23.7383 },
            "10431": { lat: 37.9838, lon: 23.7275 },
            "18531": { lat: 37.9429, lon: 23.6462 }
        };

        const map = L.map('map').setView([37.9838, 23.7275], 13);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap & &copy; CARTO'
        }).addTo(map);

        let mapLayers = [];
        let currentRoutesData = null;
        let currentMapRequestId = 0;

        function clearMap() {
            currentMapRequestId++;
            mapLayers.forEach(layer => map.removeLayer(layer));
            mapLayers = [];
        }

        let LOCAL_POSTCODES = {};

        fetch('../data/postcodes_attica.json')
            .then(res => res.json())
            .then(data => {
                LOCAL_POSTCODES = data;
            })
            .catch(err => console.error("Could not load local postcodes:", err));

        async function geocode(tk) {
            const cleanTk = tk.trim();
            if (LOCAL_POSTCODES[cleanTk]) {
                return { lat: LOCAL_POSTCODES[cleanTk].lat, lon: LOCAL_POSTCODES[cleanTk].lon, tk: cleanTk };
            }
            if (KNOWN_COORDS[cleanTk]) {
                return { lat: KNOWN_COORDS[cleanTk].lat, lon: KNOWN_COORDS[cleanTk].lon, tk: cleanTk };
            }

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=gr&postalcode=${cleanTk}`);
                const data = await res.json();
                if (data && data.length > 0) {
                    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), tk: cleanTk };
                }
            } catch (e) {
                console.warn("Nominatim Geocoding Fallback Failed:", e);
            }
            return { lat: 37.9857, lon: 23.6792, tk: cleanTk };
        }

        async function fetchOSRM(port, profile, start, end) {
            try {
                const url = `http://localhost:${port}/route/v1/${profile}/${start.lon},${start.lat};${end.lon},${end.lat}?overview=full&geometries=geojson`;
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    if (data.routes && data.routes.length > 0) {
                        return data.routes[0];
                    }
                }
            } catch (e) {
                console.warn(`OSRM Docker Engine Port ${port} Offline. Using Haversine Fallback.`);
            }

            const R = 6371.0;
            const phi1 = start.lat * Math.PI / 180;
            const phi2 = end.lat * Math.PI / 180;
            const dphi = (end.lat - start.lat) * Math.PI / 180;
            const dlambda = (end.lon - start.lon) * Math.PI / 180;
            const a = Math.sin(dphi/2)**2 + Math.cos(phi1)*Math.cos(phi2)*Math.sin(dlambda/2)**2;
            const straightKm = 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const multiplier = (profile === 'walking') ? 1.15 : 1.25;
            const distMeters = straightKm * multiplier * 1000;
            const speedKmh = (profile === 'walking') ? 4.5 : 30.0;
            const durSeconds = (distMeters / 1000 / speedKmh) * 3600;

            return {
                distance: distMeters,
                duration: durSeconds,
                geometry: {
                    coordinates: [
                        [start.lon, start.lat],
                        [end.lon, end.lat]
                    ]
                }
            };
        }

        async function drawLegOnMap(reqId, port, profile, p1, p2, color, dashArray = null, weight = 6) {
            if (reqId !== currentMapRequestId) return;
            const r = await fetchOSRM(port, profile, p1, p2);
            if (reqId !== currentMapRequestId) return;

            if (r && r.geometry) {
                const coords = r.geometry.coordinates.map(c => [c[1], c[0]]);
                const underlay = L.polyline(coords, { color: '#090d16', weight: weight + 3, opacity: 0.75 }).addTo(map);
                const poly = L.polyline(coords, { color, weight, opacity: 1.0, dashArray }).addTo(map);
                mapLayers.push(underlay, poly);
            }
        }

        function KNOWN_STATION_NAMES(tk) {
            const cleanTk = tk.trim();
            if (KNOWN_STATIONS[cleanTk]) return KNOWN_STATIONS[cleanTk];
            return {
                area: `Postal Area TK ${cleanTk}`,
                busStop: `OSY Stop TK ${cleanTk}`,
                metroStation: `Metro Station TK ${cleanTk}`
            };
        }

        async function calculateRoute() {
            const tk1 = document.getElementById('tkStart').value.trim();
            const tk2 = document.getElementById('tkEnd').value.trim();
            const scenario = document.getElementById('timeScenario').value;
            const isPeak = (scenario === 'peak');

            const loadingState = document.getElementById('loadingState');
            const resultsDiv = document.getElementById('results');

            loadingState.style.display = 'block';
            resultsDiv.innerHTML = '';

            const start = await geocode(tk1);
            const end = await geocode(tk2);

            const carRoute = await fetchOSRM(5000, 'driving', start, end);
            const footRoute = await fetchOSRM(5001, 'walking', start, end);

            loadingState.style.display = 'none';

            const startStationInfo = KNOWN_STATION_NAMES(tk1);
            const endStationInfo = KNOWN_STATION_NAMES(tk2);

            const busStop1 = { lat: start.lat + 0.002, lon: start.lon + 0.002, name: startStationInfo.busStop };
            const metroStation1 = { lat: start.lat + 0.004, lon: start.lon + 0.004, name: startStationInfo.metroStation };
            const busStop2 = { lat: end.lat - 0.002, lon: end.lon - 0.002, name: endStationInfo.busStop };

            currentRoutesData = { start, end, carRoute, footRoute, tk1, tk2, busStop1, metroStation1, busStop2 };

            const carMultiplier = isPeak ? 1.45 : 1.0;
            const metroWait1 = isPeak ? 4 : 6;
            const busWait1 = isPeak ? 7 : 11;

            const EF_CAR   = 120.0;
            const EF_MOTO  = 70.0;
            const EF_BUS   = 10.81;
            const EF_METRO = 3.1;

            const carDistKm = carRoute ? (carRoute.distance / 1000) : 2.5;
            const carDurMin = carRoute ? (carRoute.duration / 60 * carMultiplier) : (10.0 * carMultiplier);
            const carCO2Grams = Math.round(carDistKm * EF_CAR);

            const motoDistKm = carDistKm;
            const motoDurMin = carDurMin * 0.90;
            const motoCO2Grams = Math.round(motoDistKm * EF_MOTO);

            const footDistKm = footRoute ? (footRoute.distance / 1000) : 1.8;
            const footDurMin = footRoute ? Math.round(footRoute.duration / 60) : 22;

            const straightKm = Math.sqrt(Math.pow((start.lat - end.lat)*111, 2) + Math.pow((start.lon - end.lon)*88, 2));
            const busDistKm = (straightKm * 1.15);

            const t1_walk1 = 4;
            const t1_wait1 = metroWait1;
            const t1_inMetro = Math.max(3, Math.round(straightKm * 1.5));
            const t1_wait2 = busWait1;
            const t1_inBus = Math.max(4, Math.round(straightKm * 1.8 * (isPeak ? 1.0 : 0.8)));
            const t1_walk2 = 3;

            const t1_inVehicleTotal = t1_inMetro + t1_inBus;
            const t1_waitTotal = t1_wait1 + t1_wait2;
            const t1_totalDur = t1_walk1 + t1_waitTotal + t1_inVehicleTotal + t1_walk2;
            const t1_co2Grams = Math.round((busDistKm * 0.45 * EF_METRO) + (busDistKm * 0.55 * EF_BUS));

            const t2_walk1 = 5;
            const t2_wait1 = isPeak ? 9 : 14;
            const t2_inBus = Math.max(8, Math.round(straightKm * 3.1 * (isPeak ? 1.0 : 0.8)));
            const t2_walk2 = 4;

            const t2_inVehicleTotal = t2_inBus;
            const t2_waitTotal = t2_wait1;
            const t2_totalDur = t2_walk1 + t2_waitTotal + t2_inVehicleTotal + t2_walk2;
            const t2_co2Grams = Math.round(busDistKm * EF_BUS);

            const hasCar = document.getElementById('hasCar').checked;
            const hasMoto = document.getElementById('hasMoto').checked;

            const ASC_CAR   = 12.0;
            const ASC_MOTO  = 14.0;
            const ASC_T1    = -8.0;
            const ASC_T2    = -6.0;
            const ASC_FOOT  = 0.0;

            // Parking search penalty adjusted to +4.0 min for car (large campus parking) and +1.0 min for moto
            // Running fuel/maintenance cost factor increased to 0.35 for car and 0.18 for moto
            const C_car  = (carDurMin + 4.0) + (carDistKm * 0.35 * 5) + ASC_CAR;
            const C_moto = (motoDurMin + 1.0) + (carDistKm * 0.18 * 5) + ASC_MOTO;
            const C_t1   = (t1_inVehicleTotal + t1_walk1 + t1_walk2) + (1.2 * t1_waitTotal) + 4.0 + ASC_T1;
            const C_t2   = (t2_inVehicleTotal + t2_walk1 + t2_walk2) + (1.2 * t2_waitTotal) + ASC_T2;
            const C_foot = footDurMin * 1.1 + ASC_FOOT;

            let footBias = 0;
            if (footDistKm <= 0.6) footBias = -30.0;
            else if (footDistKm <= 1.0) footBias = -12.0;
            else if (footDistKm <= 1.5) footBias = 0.0;
            else footBias = 30.0;

            const C_foot_adj = C_foot + footBias;

            const theta = 0.09;
            const expCar  = hasCar ? Math.exp(-theta * C_car) : 0.0;
            const expMoto = hasMoto ? Math.exp(-theta * C_moto) : 0.0;
            const expT1   = Math.exp(-theta * C_t1);
            const expT2   = Math.exp(-theta * C_t2);
            const expFoot = Math.exp(-theta * C_foot_adj);
            const sumExp  = expCar + expMoto + expT1 + expT2 + expFoot;

            let pCar  = expCar / sumExp;
            let pMoto = expMoto / sumExp;
            let pT1   = expT1 / sumExp;
            let pT2   = expT2 / sumExp;
            let pFoot = expFoot / sumExp;

            const totalP = pCar + pMoto + pT1 + pT2 + pFoot;
            const pctCar  = Math.round((pCar / totalP) * 100);
            const pctMoto = Math.round((pMoto / totalP) * 100);
            const pctT1   = Math.round((pT1 / totalP) * 100);
            const pctT2   = Math.round((pT2 / totalP) * 100);
            const pctFoot = 100 - (pctCar + pctMoto + pctT1 + pctT2);

            const cardsData = [
                {
                    mode: 'transit1',
                    name: 'Metro + Bus Transit',
                    pct: pctT1,
                    dur: t1_totalDur,
                    co2: t1_co2Grams,
                    html: `
                <div class="card" id="card-transit1" onclick="showOnMap('transit1')">
                    <div class="card-header">
                        <span class="mode-title">Metro + Bus Transit</span>
                        <span class="card-badge">Logit: ${pctT1}% P(i)</span>
                    </div>
                    <div class="card-metrics">
                        <div class="metric"><span class="metric-val">${t1_totalDur} min</span><span class="metric-lbl">Total Time</span></div>
                        <div class="metric"><span class="metric-val">${t1_inVehicleTotal} min</span><span class="metric-lbl">In-Vehicle</span></div>
                        <div class="metric"><span class="metric-val">${t1_waitTotal} min</span><span class="metric-lbl">Wait Time</span></div>
                    </div>
                    <div class="co2-box">
                        <span class="co2-lbl">Carbon Footprint (per pax):</span>
                        <span class="co2-val">${t1_co2Grams} g CO₂</span>
                    </div>
                    <div class="steps-flow">
                        <div class="step-row">
                            <div>
                                <span class="step-tag">Walk</span>
                                <span class="step-title-text">Walk to Bus Stop</span>
                                <div class="step-subtext">Origin (TK ${tk1})</div>
                            </div>
                            <span class="step-meta">${t1_walk1} min</span>
                        </div>
                        <div class="step-row">
                            <div>
                                <span class="step-tag">Wait</span>
                                <span class="step-title-text">Wait at OSY Stop</span>
                                <div class="step-subtext">${busStop1.name}</div>
                            </div>
                            <span class="step-meta">${t1_wait1} min</span>
                        </div>
                        <div class="step-row">
                            <div>
                                <span class="step-tag">Metro</span>
                                <span class="step-title-text">Metro Line 3 (EF: 3.1 g/pax-km)</span>
                                <div class="step-subtext">${metroStation1.name}</div>
                            </div>
                            <span class="step-meta">${t1_inMetro} min</span>
                        </div>
                        <div class="step-row">
                            <div>
                                <span class="step-tag">Transfer</span>
                                <span class="step-title-text">Transfer to Bus 831</span>
                                <div class="step-subtext">Bus Transfer Node</div>
                            </div>
                            <span class="step-meta">${t1_wait2} min</span>
                        </div>
                        <div class="step-row">
                            <div>
                                <span class="step-tag">Bus</span>
                                <span class="step-title-text">Bus 831 (EF: 10.81 g/pax-km)</span>
                                <div class="step-subtext">To ${busStop2.name}</div>
                            </div>
                            <span class="step-meta">${t1_inBus} min</span>
                        </div>
                        <div class="step-row">
                            <div>
                                <span class="step-tag">Walk</span>
                                <span class="step-title-text">Walk to Campus</span>
                                <div class="step-subtext">Destination (TK ${tk2})</div>
                            </div>
                            <span class="step-meta">${t1_walk2} min</span>
                        </div>
                    </div>
                </div>`
                },
                {
                    mode: 'transit2',
                    name: 'Direct Bus Transit',
                    pct: pctT2,
                    dur: t2_totalDur,
                    co2: t2_co2Grams,
                    html: `
                <div class="card" id="card-transit2" onclick="showOnMap('transit2')">
                    <div class="card-header">
                        <span class="mode-title">Direct Bus Line</span>
                        <span class="card-badge">Logit: ${pctT2}% P(i)</span>
                    </div>
                    <div class="card-metrics">
                        <div class="metric"><span class="metric-val">${t2_totalDur} min</span><span class="metric-lbl">Total Time</span></div>
                        <div class="metric"><span class="metric-val">${t2_inVehicleTotal} min</span><span class="metric-lbl">In-Vehicle</span></div>
                        <div class="metric"><span class="metric-val">${t2_waitTotal} min</span><span class="metric-lbl">Wait Time</span></div>
                    </div>
                    <div class="co2-box">
                        <span class="co2-lbl">Carbon Footprint (per pax):</span>
                        <span class="co2-val">${t2_co2Grams} g CO₂</span>
                    </div>
                    <div class="steps-flow">
                        <div class="step-row">
                            <div>
                                <span class="step-tag">Walk</span>
                                <span class="step-title-text">Walk to Bus Stop</span>
                                <div class="step-subtext">Origin (TK ${tk1})</div>
                            </div>
                            <span class="step-meta">${t2_walk1} min</span>
                        </div>
                        <div class="step-row">
                            <div>
                                <span class="step-tag">Wait</span>
                                <span class="step-title-text">Wait at OSY Stop</span>
                                <div class="step-subtext">${busStop1.name}</div>
                            </div>
                            <span class="step-meta">${t2_wait1} min</span>
                        </div>
                        <div class="step-row">
                            <div>
                                <span class="step-tag">Bus</span>
                                <span class="step-title-text">Direct Bus A15 (EF: 10.81 g/pax-km)</span>
                                <div class="step-subtext">To ${busStop2.name}</div>
                            </div>
                            <span class="step-meta">${t2_inBus} min</span>
                        </div>
                        <div class="step-row">
                            <div>
                                <span class="step-tag">Walk</span>
                                <span class="step-title-text">Walk to Campus</span>
                                <div class="step-subtext">Destination (TK ${tk2})</div>
                            </div>
                            <span class="step-meta">${t2_walk2} min</span>
                        </div>
                    </div>
                </div>`
                },
                {
                    mode: 'car',
                    name: 'Private Car (1.25 pax)',
                    pct: pctCar,
                    dur: carDurMin.toFixed(1),
                    co2: carCO2Grams,
                    html: `
                <div class="card" id="card-car" onclick="showOnMap('car')">
                    <div class="card-header">
                        <span class="mode-title">Private Car</span>
                        <span class="card-badge">Logit: ${pctCar}% P(i)</span>
                    </div>
                    <div class="card-metrics">
                        <div class="metric"><span class="metric-val">${carDistKm.toFixed(2)} km</span><span class="metric-lbl">Distance</span></div>
                        <div class="metric"><span class="metric-val">${carDurMin.toFixed(1)} min</span><span class="metric-lbl">Drive Time</span></div>
                        <div class="metric"><span class="metric-val">120 g</span><span class="metric-lbl">EF (g/pax-km)</span></div>
                    </div>
                    <div class="co2-box">
                        <span class="co2-lbl">Carbon Footprint:</span>
                        <span class="co2-val">${carCO2Grams} g CO₂</span>
                    </div>
                </div>`
                },
                {
                    mode: 'moto',
                    name: 'Motorcycle (1.0 pax)',
                    pct: pctMoto,
                    dur: motoDurMin.toFixed(1),
                    co2: motoCO2Grams,
                    html: `
                <div class="card" id="card-moto" onclick="showOnMap('car')">
                    <div class="card-header">
                        <span class="mode-title">Motorcycle</span>
                        <span class="card-badge">Logit: ${pctMoto}% P(i)</span>
                    </div>
                    <div class="card-metrics">
                        <div class="metric"><span class="metric-val">${motoDistKm.toFixed(2)} km</span><span class="metric-lbl">Distance</span></div>
                        <div class="metric"><span class="metric-val">${motoDurMin.toFixed(1)} min</span><span class="metric-lbl">Travel Time</span></div>
                        <div class="metric"><span class="metric-val">70 g</span><span class="metric-lbl">EF (g/pax-km)</span></div>
                    </div>
                    <div class="co2-box">
                        <span class="co2-lbl">Carbon Footprint:</span>
                        <span class="co2-val">${motoCO2Grams} g CO₂</span>
                    </div>
                </div>`
                },
                {
                    mode: 'foot',
                    name: 'Pedestrian (Walk-Only)',
                    pct: pctFoot,
                    dur: footDurMin,
                    co2: 0,
                    html: `
                <div class="card" id="card-foot" onclick="showOnMap('foot')">
                    <div class="card-header">
                        <span class="mode-title">Pedestrian Walk</span>
                        <span class="card-badge">Logit: ${pctFoot}% P(i)</span>
                    </div>
                    <div class="card-metrics">
                        <div class="metric"><span class="metric-val">${footDistKm.toFixed(2)} km</span><span class="metric-lbl">Walk Distance</span></div>
                        <div class="metric"><span class="metric-val">${footDurMin} min</span><span class="metric-lbl">Walk Time</span></div>
                        <div class="metric"><span class="metric-val">0 g</span><span class="metric-lbl">EF (g/pax-km)</span></div>
                    </div>
                    <div class="co2-box">
                        <span class="co2-lbl">Carbon Footprint:</span>
                        <span class="co2-val">0 g CO₂</span>
                    </div>
                </div>`
                }
            ];

            cardsData.sort((a, b) => b.pct - a.pct);

            const selectedRoute = cardsData[0];

            resultsDiv.innerHTML = `
                <!-- MONOCHROME MINIMALIST SELECTED ROUTE CARD -->
                <div class="card active" id="card-selected" onclick="showOnMap('${selectedRoute.mode}')">
                    <div style="font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); margin-bottom: 4px;">
                        SELECTED OPTIMAL ROUTE (LOGIT MODEL)
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 1.05rem; font-weight: 700; color: #ffffff;">${selectedRoute.name}</span>
                        <span style="background: #38bdf8; color: #030712; padding: 3px 10px; border-radius: 4px; font-weight: 800; font-size: 0.82rem;">
                            P(i) = ${selectedRoute.pct}%
                        </span>
                    </div>
                    <div style="display: flex; gap: 20px; margin-top: 8px; font-size: 0.82rem; color: var(--text-muted);">
                        <span>Duration: <b style="color: #ffffff;">${selectedRoute.dur} min</b></span>
                        <span>Emissions: <b style="color: #38bdf8;">${selectedRoute.co2} g CO₂</b></span>
                    </div>
                </div>

                <!-- SORTED ROUTE CARDS -->
                ${cardsData.map(c => c.html).join('')}
            `;

            await showOnMap(selectedRoute.mode);
        }

        async function showOnMap(mode) {
            if (!currentRoutesData) return;
            clearMap();
            const reqId = currentMapRequestId;

            const { start, end, carRoute, footRoute, tk1, tk2, busStop1, metroStation1, busStop2 } = currentRoutesData;

            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            const activeCard = document.getElementById(`card-${mode}`);
            if (activeCard) activeCard.classList.add('active');

            const bounds = L.latLngBounds([[start.lat, start.lon], [end.lat, end.lon]]);

            function addMarker(lat, lon, popupHtml) {
                if (reqId !== currentMapRequestId) return;
                const m = L.marker([lat, lon]).addTo(map).bindPopup(popupHtml);
                mapLayers.push(m);
            }

            if (mode === 'car' && carRoute) {
                if (reqId !== currentMapRequestId) return;
                const coords = carRoute.geometry.coordinates.map(c => [c[1], c[0]]);
                const u = L.polyline(coords, { color: '#090d16', weight: 8, opacity: 0.75 }).addTo(map);
                const p = L.polyline(coords, { color: '#0284c7', weight: 6, opacity: 1.0 }).addTo(map);
                mapLayers.push(u, p);
                addMarker(start.lat, start.lon, `<b>Origin:</b> TK ${tk1}`);
                addMarker(end.lat, end.lon, `<b>Destination:</b> TK ${tk2}`);
            } 
            else if (mode === 'moto' && carRoute) {
                if (reqId !== currentMapRequestId) return;
                const coords = carRoute.geometry.coordinates.map(c => [c[1], c[0]]);
                const u = L.polyline(coords, { color: '#090d16', weight: 8, opacity: 0.75 }).addTo(map);
                const p = L.polyline(coords, { color: '#d946ef', weight: 6, opacity: 1.0 }).addTo(map);
                mapLayers.push(u, p);
                addMarker(start.lat, start.lon, `<b>Origin:</b> TK ${tk1}`);
                addMarker(end.lat, end.lon, `<b>Destination:</b> TK ${tk2}`);
            }
            else if (mode === 'foot' && footRoute) {
                if (reqId !== currentMapRequestId) return;
                const coords = footRoute.geometry.coordinates.map(c => [c[1], c[0]]);
                const u = L.polyline(coords, { color: '#090d16', weight: 7, opacity: 0.75 }).addTo(map);
                const p = L.polyline(coords, { color: '#059669', weight: 5, opacity: 1.0, dashArray: '6, 6' }).addTo(map);
                mapLayers.push(u, p);
                addMarker(start.lat, start.lon, `<b>Origin:</b> TK ${tk1}`);
                addMarker(end.lat, end.lon, `<b>Destination:</b> TK ${tk2}`);
            }
            else if (mode === 'transit1') {
                await drawLegOnMap(reqId, 5001, 'walking', start, busStop1, '#059669', '6, 6', 4);
                await drawLegOnMap(reqId, 5000, 'driving', busStop1, metroStation1, '#9333ea', null, 6);
                await drawLegOnMap(reqId, 5000, 'driving', metroStation1, busStop2, '#d97706', null, 6);
                await drawLegOnMap(reqId, 5001, 'walking', busStop2, end, '#059669', '6, 6', 4);

                if (reqId !== currentMapRequestId) return;
                addMarker(start.lat, start.lon, `<b>Origin:</b> TK ${tk1}`);
                addMarker(busStop1.lat, busStop1.lon, `<b>OSY Stop: ${busStop1.name}</b><br/>Board Metro Line 3`);
                addMarker(metroStation1.lat, metroStation1.lon, `<b>Metro: ${metroStation1.name}</b><br/>Transfer to Bus 831`);
                addMarker(busStop2.lat, busStop2.lon, `<b>OSY Stop: ${busStop2.name}</b><br/>Walk to campus`);
                addMarker(end.lat, end.lon, `<b>Destination:</b> TK ${tk2}`);
            }
            else if (mode === 'transit2') {
                await drawLegOnMap(reqId, 5001, 'walking', start, busStop1, '#059669', '6, 6', 4);
                await drawLegOnMap(reqId, 5000, 'driving', busStop1, busStop2, '#d97706', null, 6);
                await drawLegOnMap(reqId, 5001, 'walking', busStop2, end, '#059669', '6, 6', 4);

                if (reqId !== currentMapRequestId) return;
                addMarker(start.lat, start.lon, `<b>Origin:</b> TK ${tk1}`);
                addMarker(busStop1.lat, busStop1.lon, `<b>OSY Stop: ${busStop1.name}</b><br/>Board Direct Bus A15`);
                addMarker(busStop2.lat, busStop2.lon, `<b>OSY Stop: ${busStop2.name}</b><br/>Walk to campus`);
                addMarker(end.lat, end.lon, `<b>Destination:</b> TK ${tk2}`);
            }

            if (reqId === currentMapRequestId) {
                map.fitBounds(bounds, { padding: [60, 60] });
            }
        }

        window.onload = calculateRoute;
    </script>
</body>
</html>
